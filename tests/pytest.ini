[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    --html=reports/test_report.html
    --self-contained-html
    -v
    --tb=short
    --strict-markers
markers =
    patient: Tests for patient module
    doctor: Tests for doctor module
    integration: Cross-module integration tests
    slow: Long-running tests
    ecommerce: Tests for e-commerce module
    success_screenshot: Capture and embed screenshots for passed tests
